version: '3.8'

services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - DATABASE_URL=postgresql://jobmesh:jobmesh123@postgres:5432/jobmesh
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    command: node src/worker.js
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://jobmesh:jobmesh123@postgres:5432/jobmesh
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=jobmesh
      - POSTGRES_PASSWORD=jobmesh123
      - POSTGRES_DB=jobmesh
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
